name: Let's Insights — relatório ClickUp

# Agendamento desligado em 2026-10-14: o Yago deixou de usar este relatório.
# Antes rodava toda sexta (cron "0 12 * * 5" = 09:00 BRT). O arquivo fica
# no repositório e ainda pode ser disparado manualmente pela aba Actions.
on:
  workflow_dispatch:

jobs:
  report-clickup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run report-clickup
        env:
          EGOI_API_KEY: ${{ secrets.EGOI_API_KEY }}
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
