name: Let's Insights — newsletter semanal

# Roda toda segunda de MADRUGADA: 05:17 UTC = 02:17 BRT (UTC-3). Desde
# out/2026 a curadoria e a redação usam a API de lote da Claude (metade do
# preço, sem prazo garantido); começar cedo dá tempo de esperar o lote até
# 06:00 BRT, com volta para a chamada normal depois disso (ver lib/claude.js).
# Minuto quebrado (17, não 00) de propósito: execuções agendadas em hora cheia
# sofrem mais atraso de fila. Mesmo assim o GitHub pode atrasar muito: em
# 26/10/2026 a execução marcada para 05:53 BRT só começou às 12:30.
# Também pode ser disparado manualmente pela aba Actions (workflow_dispatch).
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Etapas ENCADEADAS de verdade: cada job só começa se o anterior passar (needs).
# Sem mais "espero 4 minutos e rezo".
jobs:
  wf01-coleta:
    runs-on: ubuntu-latest
    # contents:write necessário pra commitar o banco SQLite atualizado — ver lib/db.js
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # O modelo do Claude fica versionado no código (src/lib/config.js), não
      # no secret CLAUDE_MODEL (out/2026: o secret ainda apontava pro Sonnet 4.5).
      - run: npm run wf01
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  wf02-curadoria:
    needs: wf01-coleta
    runs-on: ubuntu-latest
    # contents:write necessário pra commitar a imagem gerada via IA (fallback) e o banco SQLite — ver lib/gitAssets.js e lib/db.js
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run wf02
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  wf03-montagem-envio:
    needs: wf02-curadoria
    runs-on: ubuntu-latest
    # contents:write necessário pra commitar o banco SQLite atualizado — ver lib/db.js
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run wf03
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PREVIEW_TO: ${{ secrets.PREVIEW_TO }}
          EGOI_API_KEY: ${{ secrets.EGOI_API_KEY }}
          # Interruptor do agendamento automático no E-goi (decisão de 2026-10-22).
          # Variável (não secret) do repositório: só agenda com o valor "ligado".
          # Sem a variável criada, o WF-03 só cria rascunhos, como antes.
          EGOI_AGENDAMENTO: ${{ vars.EGOI_AGENDAMENTO }}
